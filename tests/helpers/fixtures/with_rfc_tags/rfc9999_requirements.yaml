rfc: rfc9999
sections:
  "4.1":
    level: MUST
    text: "An endpoint MUST NOT initiate a connection to a peer it is already connected to."
    tags:
      - "rfc9999:4.1"
  "4.2":
    level: MUST
    text: "After connecting, the connected_to mapping MUST reflect the destination."
    tags:
      - "rfc9999:4.2"
  "5.1":
    level: MUST
    text: "Error handling MUST only process non-zero error codes."
    tags:
      - "rfc9999:5.1"
  "5.2":
    level: SHOULD
    text: "After an error is handled, the error SHOULD be recorded."
    tags:
      - "rfc9999:5.2"
