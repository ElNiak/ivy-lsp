[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ivy-lsp"
version = "0.10.0"
description = "Language Server Protocol implementation for the Ivy formal specification language"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "ElNiak"}]
keywords = ["ivy", "lsp", "language-server", "formal-verification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Text Editors :: Integrated Development Environments (IDE)",
]
dependencies = [
    "pygls>=1.0",
    "lsprotocol",
    "panther_ms_ivy",
]

[project.optional-dependencies]
full = ["panther_ms_ivy[z3]"]
mcp = ["mcp>=1.0"]
dev = [
    "pytest",
    "pytest-asyncio",
    "black",
    "isort",
    "flake8",
]

[project.scripts]
ivy_lsp = "ivy_lsp.__main__:main"

[project.urls]
Homepage = "https://github.com/ElNiak/ivy-lsp"
Repository = "https://github.com/ElNiak/ivy-lsp"
Issues = "https://github.com/ElNiak/ivy-lsp/issues"

[tool.setuptools.packages.find]
include = ["ivy_lsp*"]

[tool.black]
target-version = ["py310"]
line-length = 88

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
